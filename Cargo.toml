[workspace]
resolver = "2"
members = ["crates/engine", "crates/settings", "crates/app", "crates/project", "crates/plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Audio code must be fast even in debug builds, or playback crackles while developing.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
# Keep our own audio code fully optimised in debug builds too, so the setup
# benchmark and playback behave like a real build.
[profile.dev.package.isai-engine]
opt-level = 3
