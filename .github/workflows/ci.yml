name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows check the oldest Qt we support. macOS needs a
          # newer one: Qt 6.9's headers don't build with the runner's Xcode.
          - os: ubuntu-latest
            qt: "6.9.*"
          - os: windows-latest
            qt: "6.9.*"
          - os: macos-latest
            qt: "6.12.*"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qtshadertools qtmultimedia
          cache: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libgl1-mesa-dev libxkbcommon-dev libxcb1-dev libx11-xcb-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build the release application
        run: cargo build --release -p isai
      - name: Check macOS packaging script syntax
        if: runner.os == 'macOS'
        run: bash -n tools/package-macos.sh
