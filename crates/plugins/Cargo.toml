[package]
name = "isai-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hosting third-party plugins (VST3; CLAP and Audio Units next) for Isai"

[dependencies]
isai-engine = { version = "0.0.1", path = "../engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# VST3 hosting (MIT). Its default features add an audio backend and process
# isolation we don't use: Isai has its own engine.
vst3-host = { version = "=0.10.0", default-features = false }
# CLAP hosting (MIT OR Apache-2.0).
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "state", "gui"] }

[target.'cfg(target_os = "macos")'.dependencies]
# A plain window to hold a CLAP plugin's view (the same versions vst3-host uses).
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSResponder", "NSView", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSBundle", "NSURL"] }
# Audio Units, through Apple's C API.
objc2-audio-toolbox = { version = "0.3.2", features = ["AUComponent", "AudioComponent", "MusicDevice", "objc2-core-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFPropertyList", "CFData", "CFString"] }

[dev-dependencies]
# Only for the test plugin (examples/test_clap.rs), which tests CLAP hosting.
clack-plugin = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-plugin", "state"] }

[[example]]
name = "test_clap"
crate-type = ["cdylib"]
